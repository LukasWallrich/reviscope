[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviscope"
version = "0.2.0a1"
description = "Auditable, modular peer-review pipeline for the social sciences"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["pydantic>=2.7", "PyYAML>=6", "pypdf>=5", "python-docx>=1.1", "scipy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reviscope = "reviscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reviscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
